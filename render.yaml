services:
  - type: web
    name: gemini-ai-agent-workspace
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: BROWSER_USE_MCP_URL
        sync: false
      - key: BROWSER_USE_MCP_TOOL
        value: run_browser_agent
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_APP_NAME
        value: VisaMOTion AI
