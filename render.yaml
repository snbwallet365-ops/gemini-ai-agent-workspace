services:
  - type: web
    name: gemini-ai-agent-workspace
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_ACCESS_PIN
        sync: false
      - key: ADMIN_MASTER_PIN
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: BROWSER_USE_API_KEY
        sync: false
      - key: WHATSAPP_CLOUD_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: BROWSER_USE_MCP_URL
        sync: false
      - key: BROWSER_USE_MCP_TOOL
        value: run_browser_agent
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: AWS_MARKETPLACE_MCP_URL
        value: https://marketplace-mcp.us-east-1.api.aws/mcp
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_APP_NAME
        value: VisaMOTion AI
